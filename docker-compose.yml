services:
  finance-app:
    build: .
    container_name: meu-financeiro-service
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=meu_agente_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres_seguro
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - web_network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: meu-financeiro-db
    environment:
      - POSTGRES_DB=meu_agente_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_seguro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meu_agente_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    name: meu-financeiro-net
  web_network:
    external: true

volumes:
  pgdata:
