services:
  finance-app:
    build: .
    container_name: meu-financeiro-dev
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST:-postgres_dev}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${FINANCEIRO_DB_NAME:-${DB_NAME:-financeiro_db}}
      - DB_USER=${FINANCEIRO_DB_USER:-${DB_USER:-financeiro_user}}
      - DB_PASSWORD=${FINANCEIRO_DB_PASSWORD:-${DB_PASSWORD:-financeiro_dev_password}}
      - HOST=0.0.0.0
      - PORT=8000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_AUTHORIZED_USER_IDS=${TELEGRAM_AUTHORIZED_USER_IDS:-}
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:1234}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - .:/app
      - /app/.venv
    command: ["uv", "run", "meu-financeiro", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - dev_db_network
    restart: unless-stopped

networks:
  dev_db_network:
    external: true
