services:
  agent:
    build: .
    container_name: meu-agente-cli
    environment:
      # Conexão interna com o PostgreSQL
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=meu_agente_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres_seguro
      # URL do LM Studio no servidor de produção
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://192.168.1.15:1234}
      # Configuração persistente do Google Cloud SDK
      - CLOUDSDK_CONFIG=/root/.config/meu-agente-cli/gcloud
      # Cloudflare Workers AI
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - agent_data:/root/.config/meu-agente-cli
      - .:/app
      - /app/.venv
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  telegram-bot:
    build: .
    container_name: meu-agente-telegram
    command: uv run python3 -m meu_agente_cli.telegram_app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=meu_agente_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres_seguro
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://192.168.1.15:1234}
      - CLOUDSDK_CONFIG=/root/.config/meu-agente-cli/gcloud
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_AUTHORIZED_USER_IDS=${TELEGRAM_AUTHORIZED_USER_IDS}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - agent_data:/root/.config/meu-agente-cli
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  dashboard:
    build: .
    container_name: meu-agente-dashboard
    command: uv run --no-dev python3 -m meu_agente_cli.gradio_app
    expose:
      - "7860"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=meu_agente_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres_seguro
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - PYTHONUNBUFFERED=1
    volumes:
      - agent_data:/root/.config/meu-agente-cli
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - web_network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: meu-agente-db
    environment:
      - POSTGRES_DB=meu_agente_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_seguro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meu_agente_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    name: meu-agente-net
  web_network:
    external: true

volumes:
  agent_data:
  pgdata:
