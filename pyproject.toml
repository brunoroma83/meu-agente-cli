[project]
name = "meu-agente-cli"
version = "0.2.0"
description = "Serviço de Gestão Financeira com Web UI Leve e MCP Server para o Hermes"
readme = "README.md"
authors = [
    { name = "Bruno Roma", email = "bruuno@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "yfinance>=1.5.0",
    "mcp>=2.2.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
meu-financeiro = "meu_agente_cli.main:run_server"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
