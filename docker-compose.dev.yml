services:
  finance-app:
    build: .
    container_name: meu-financeiro-dev
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=meu_agente_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres_seguro
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: meu-financeiro-db-dev
    environment:
      - POSTGRES_DB=meu_agente_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_seguro
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meu_agente_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
