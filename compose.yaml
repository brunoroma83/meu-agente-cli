services:
  finance-app:
    build: .
    container_name: meu-financeiro-service
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${FINANCEIRO_DB_NAME:-${DB_NAME:-financeiro_db}}
      - DB_USER=${FINANCEIRO_DB_USER:-${DB_USER:-financeiro_user}}
      - DB_PASSWORD=${FINANCEIRO_DB_PASSWORD:-${DB_PASSWORD}}
      - HOST=0.0.0.0
      - PORT=8000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_AUTHORIZED_USER_IDS=${TELEGRAM_AUTHORIZED_USER_IDS:-}
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:1234}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    networks:
      - postgres_network
      - web_network
    restart: unless-stopped

networks:
  postgres_network:
    external: true
  web_network:
    external: true
